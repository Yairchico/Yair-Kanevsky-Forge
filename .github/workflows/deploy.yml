name: Deploy to Cloudflare Workers (staging)

# Auto-deploys every push to the `testing` branch to the STAGING Worker
# (yair-kanevsky-forge-staging) so changes are visible somewhere without
# ever touching the production Worker (yair-kanevsky-forge) that's now in
# real use. Promoting a change to production is a separate, manual-only
# step — see deploy-production.yml.
#
# IMPORTANT — why `testing` and not `claude/fitness-app-trainers-gccazz`:
# Cloudflare's own git-connected "Workers Builds" turned out to already be
# wired to `claude/fitness-app-trainers-gccazz` for the PRODUCTION Worker,
# deploying it straight to production on every push to that branch — fully
# independently of this workflow, with nothing showing up in GitHub Actions
# (discovered 2026-09-06 when a routine push appeared live on the real
# production URL with no deploy-production.yml run ever having fired). So:
# development now happens on `testing`; `claude/fitness-app-trainers-gccazz`
# must NOT receive pushes again unless a Cloudflare dashboard check
# (Workers & Pages → yair-kanevsky-forge → Settings → Build) confirms that
# git integration has been disconnected first.
#
# Re-applies every secret with `wrangler secret put --env staging` on every
# run, which binds it directly to the staging Worker — no dashboard
# navigation involved, so there's nothing to get wired to the wrong place
# (see CLAUDE.md's Known Gotchas for why that matters here).
#
# One-time setup (see README's "Deploy" section): add these as GitHub
# repository secrets under Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN     (dash.cloudflare.com → My Profile → API
#                             Tokens → Create Token → "Edit Cloudflare
#                             Workers" template)
#   CLOUDFLARE_ACCOUNT_ID    (shown on the Workers & Pages overview page)
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches: [testing]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* must be present at BUILD time — Next.js inlines them
      # into the compiled JS wherever they're referenced in source.
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Re-applied on every run, non-interactively, straight from GitHub's
      # encrypted secrets — this is the actual source of truth from now on.
      - name: Set staging Worker secrets
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
          printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_URL --env staging
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --env staging
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to staging
        run: npx opennextjs-cloudflare deploy --env staging
