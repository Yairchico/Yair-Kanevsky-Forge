name: Deploy to Cloudflare Workers (staging)

# Auto-deploys every push to the STAGING Worker (yair-kanevsky-forge-staging)
# so changes are visible somewhere without going through the manual
# deploy-production.yml step.
#
# ⚠️ KNOWN, ACCEPTED RISK (2026-09-06): Cloudflare's own git-connected
# "Workers Builds" is ALSO wired to this same branch
# (claude/fitness-app-trainers-gccazz) for the PRODUCTION Worker
# (yair-kanevsky-forge) — every push here can trigger a Cloudflare-side
# build+deploy straight to production, fully independent of this workflow
# and invisible from GitHub Actions (deploy-production.yml's run count
# stays at zero regardless). A branch move to `testing` was tried and
# reverted — Cloudflare's integration triggers on push to that branch too
# (confirmed via its own Deployments tab, build tagged `testing`), so it is
# NOT scoped to one branch and moving branches doesn't help. The user has
# chosen to accept this for now rather than block on it; the real fix is a
# human disconnecting the git integration in the Cloudflare dashboard
# (Workers & Pages → yair-kanevsky-forge → Settings → Build) — still
# pending. Until then, treat every push to this branch as potentially
# reaching production immediately, regardless of what this workflow does.
#
# Re-applies every secret with `wrangler secret put --env staging` on every
# run, which binds it directly to the staging Worker — no dashboard
# navigation involved, so there's nothing to get wired to the wrong place
# (see CLAUDE.md's Known Gotchas for why that matters here).
#
# One-time setup (see README's "Deploy" section): add these as GitHub
# repository secrets under Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN     (dash.cloudflare.com → My Profile → API
#                             Tokens → Create Token → "Edit Cloudflare
#                             Workers" template)
#   CLOUDFLARE_ACCOUNT_ID    (shown on the Workers & Pages overview page)
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches: [claude/fitness-app-trainers-gccazz]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* must be present at BUILD time — Next.js inlines them
      # into the compiled JS wherever they're referenced in source.
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Re-applied on every run, non-interactively, straight from GitHub's
      # encrypted secrets — this is the actual source of truth from now on.
      - name: Set staging Worker secrets
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
          printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_URL --env staging
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --env staging
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to staging
        run: npx opennextjs-cloudflare deploy --env staging
